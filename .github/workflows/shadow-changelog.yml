# Checks for new public releases every 6 hours, writes a Shadow Changelog report for each new
# version pair, rebuilds the RSS feed, and commits the results back to the repo.
name: shadow-changelog

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      app:
        description: "Adapter id (see `shadow-changelog apps`)"
        default: "obsidian"

permissions:
  contents: write

concurrency:
  group: shadow-changelog
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1   # every job commits to the same branch
      matrix:
        app: [obsidian]   # add more adapters here
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Downloaded releases are cached between runs so only new versions are fetched.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: shadow-cache-${{ matrix.app }}-${{ github.run_id }}
          restore-keys: shadow-cache-${{ matrix.app }}-

      - name: Diff the two newest public releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # raises the GitHub API rate limit for release lookups
          SHADOW_BASE_URL: https://github.com/${{ github.repository }}/blob/main/reports
          # Optional: set OPENAI_API_KEY or ANTHROPIC_API_KEY as repo secrets for a short LLM-written summary.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node bin/shadow-changelog.js latest ${{ github.event.inputs.app || matrix.app }} --out reports

      - name: Rebuild RSS feed
        run: node bin/shadow-changelog.js rss --out reports --base-url "https://github.com/${{ github.repository }}/blob/main/reports"

      - name: Commit new reports
        run: |
          git config user.name "shadow-changelog[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then echo "No new reports"; exit 0; fi
          git commit -m "report: $(ls -t reports/*.md | head -1 | xargs basename)"
          git pull --rebase
          git push
